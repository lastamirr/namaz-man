<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
    <meta name="theme-color" content="#0F4C5C">
<script src="script.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نماز من</title>
</head>
<body>
<header class="header">
    <h1>نماز من</h1>
    <p>همراهی برای نظم در عبادت</p>
</header>

<main class="container">
    <div class="dashboard-cards">
<section class="stats-section">
    <h2>آمار این ماه</h2>
    <p id="monthly-progress">۰٪ انجام شده</p>
    <div class="progress-bar">
        <div id="progress-fill"></div>
    </div>
</section>
<section class="qaza-section">
    <h2>نمازهای قضا</h2>
    <button id="qaza-button">مدیریت نمازهای قضا</button>
    <div id="qaza-panel" style="display: none;">

    <h3>ثبت نماز قضا</h3>
    <p id="qaza-total">مجموع نمازهای باقی‌مانده: ۰</p>

    <select id="qaza-prayer">
        <option value="صبح">صبح</option>
        <option value="ظهر">ظهر</option>
        <option value="عصر">عصر</option>
        <option value="مغرب">مغرب</option>
        <option value="عشا">عشا</option>
    </select>

    <input
        type="number"
        id="qaza-count"
        min="1"
        placeholder="تعداد نماز قضا"
    >

    <button id="add-qaza">ثبت</button>
<div class="backup-actions">
    <button id="export-data">دریافت نسخه پشتیبان</button>
    <button id="import-data">بازیابی اطلاعات</button>
    <input type="file" id="import-file" accept=".json" hidden>
</div>
    <div id="qaza-list"></div>
</div>
</section>
</div>
<section class="home-section">
    <h2>صفحه اصلی</h2>
    <section class="week-section">
        <h2>هفته‌های این ماه</h2>
       <div class="month-navigation">
    <button id="prev-month">ماه قبل</button>
    <p id="current-month"></p>
    <button id="next-month">ماه بعد</button>
</div>
        <div id="week-list"></div>
    </section>

    <section class="day-section">
        <h2>روزهای هفته</h2>
        <div id="day-list"></div>
    </section>

    <section class="prayer-section">
        <h2 id="selected-date">نمازهای امروز</h2>
        <div id="prayer-list"></div>
    </section>
</section>
</main>
</body>
</html>
